name: Build and Push Docker Images

# Триггеры: когда запускать workflow
on:
  push:
    branches:
      - main      # При push в main
      - develop   # При push в develop
  pull_request:
    branches:
      - main      # При создании PR в main

# Глобальные переменные
env:
  REGISTRY: ghcr.io
  IMAGE_NAME_CLIENT: ${{ github.repository }}/client
  IMAGE_NAME_SERVER: ${{ github.repository }}/server

jobs:
  # ==========================================
  # JOB 1: Сборка и пуш CLIENT
  # ==========================================
  build-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Разрешение на пуш в GHCR

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Логинимся в GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Извлекаем метаданные для тегов и лейблов
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLIENT }}
          tags: |
            # Тег с именем ветки (например, main, develop)
            type=ref,event=branch
            # Тег с хешем коммита (для точной трассировки)
            type=sha,format=long,prefix=
            # Тег latest только для main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 4. Настраиваем Docker Buildx (для улучшенной сборки)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Собираем и пушим образ
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./client          # ← Путь к папке client
          file: ./client/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}  # Пушим только если не PR
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэширование для ускорения повторных сборок
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: Сборка и пуш SERVER
  # ==========================================
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server          # ← Путь к папке server
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max